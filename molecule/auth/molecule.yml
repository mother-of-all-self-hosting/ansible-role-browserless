---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: browserless-${MOLECULE_DISTRO:-ubuntu2604}-auth
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        browserless_debug_service_enabled: false
        browserless_restarts_check_enabled: true

        # The container name of the tiny web server whose page the verification
        # has Browserless render, once it is allowed to render anything.
        browserless_probe_target_identifier: browserless-molecule-auth-target

        # Variables for Browserless
        # Spelled out (it matches the role's default) so that the
        # verification, which does not include the role, can put its probe
        # target container on the same network.
        browserless_container_network: browserless

        browserless_uid: "0"
        browserless_gid: "0"

        # The subject of this scenario. The `default` scenario leaves it empty
        # and asserts that Browserless then serves everyone; here it is set,
        # and every assertion is about the difference that makes.
        browserless_auth_token: molecule-auth-token-2b7d41

        # Published so that the verification can talk to Browserless without
        # needing a container of its own on Browserless's network.
        browserless_container_http_host_bind_port: 127.0.0.1:23001
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
