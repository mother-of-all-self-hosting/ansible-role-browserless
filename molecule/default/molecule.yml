---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: browserless-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        browserless_debug_service_enabled: false
        browserless_restarts_check_enabled: true

        # The container name of the tiny web server whose page the verification
        # has Browserless render. It lives on Browserless's own container
        # network, because Docker 28 no longer lets a container reach a port
        # published on the host through the bridge gateway.
        browserless_probe_target_identifier: browserless-molecule-default-target

        # Variables for Browserless
        # Spelled out (it matches the role's default) so that the
        # verification, which does not include the role, can put its probe
        # target container on the same network.
        browserless_container_network: browserless

        browserless_uid: "0"
        browserless_gid: "0"

        # Published so that the verification can talk to Browserless without
        # needing a container of its own on Browserless's network.
        browserless_container_http_host_bind_port: 127.0.0.1:23000

        # Deliberately neither the role's default (UTC) nor the container
        # image's own default (America/Los_Angeles), so that this timezone
        # showing up inside the running Chromium can only have come from the
        # `env` file this role renders.
        browserless_environment_variables_tz: Asia/Tokyo

        # Values which Browserless reports back through `GET /config`, each
        # different from its default (10, 10 and 30000). They are how the
        # verification tells "the role's env file reached the process" apart
        # from "the process came up with its own defaults".
        browserless_environment_variables_additional_variables: |
          CONCURRENT=7
          QUEUED=13
          TIMEOUT=45000
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
