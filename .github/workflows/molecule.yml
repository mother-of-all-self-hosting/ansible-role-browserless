---
name: molecule

on:  # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

jobs:
  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    runs-on: ubuntu-latest

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        # The Browserless image is a few gigabytes unpacked, so the matrix is
        # kept deliberately small: `default` covers both distributions, while
        # `auth` - which differs only in one environment variable and in the
        # assertions about it - runs on one.
        include:
          - scenario: default
            distro: ubuntu2604
          - scenario: default
            distro: debian13
          - scenario: auth
            distro: ubuntu2604
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: browserless

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: browserless/.python-version
          cache: pip
          cache-dependency-path: browserless/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: browserless
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('browserless/molecule/*/requirements.yml') }}

      - name: Run Molecule
        working-directory: browserless
        run: molecule test --scenario-name ${{ matrix.scenario }}
