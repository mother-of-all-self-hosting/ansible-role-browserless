---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "browserless_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Browserless settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - browserless_uid
    - browserless_gid
    - browserless_path_prefix
    - browserless_container_network

- name: Run if Traefik is enabled
  when: browserless_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Browserless are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "browserless_container_labels_traefik_hostname", when: true }
        - { "name": "browserless_container_labels_traefik_path_prefix", when: true }
        - { "name": "browserless_container_labels_traefik_middleware_basic_auth_users", when: "{{ browserless_container_labels_traefik_middleware_basic_auth_enabled }}" }

    - name: Fail if browserless_container_labels_traefik_path_prefix is different than /
      ansible.builtin.fail:
        msg: >-
          browserless_container_labels_traefik_path_prefix (`{{ browserless_container_labels_traefik_path_prefix }}`) must be `/`.
          Browserless does not support hosting under a subpath yet.
      when: "browserless_container_labels_traefik_path_prefix != '/'"

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `browserless_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if browserless_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          browserless_container_labels_traefik_path_prefix (`{{ browserless_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/browserless`).
      when: "browserless_container_labels_traefik_path_prefix != '/' and browserless_container_labels_traefik_path_prefix[-1] == '/'"

    # Browserless authenticates nothing unless `TOKEN` is set, so an instance
    # published through Traefik without one is an open renderer: anyone can
    # POST a URL to `/content` or `/screenshot` and have it fetched from
    # inside the container networks Browserless is attached to, or POST
    # JavaScript to `/function` and have it run there.
    - name: Warn if Browserless is exposed publicly without authentication
      ansible.builtin.debug:
        msg: >-
          WARNING: Browserless is exposed at `{{ browserless_container_labels_traefik_hostname }}` with neither a token
          (`browserless_auth_token`) nor basic authentication
          (`browserless_container_labels_traefik_middleware_basic_auth_enabled`) configured.
          Browserless does not authenticate requests unless a token is set, so anyone who can reach that hostname can
          make it fetch and render arbitrary URLs (`/content`, `/screenshot`, `/pdf`) - including addresses that are
          only reachable from your server - and execute arbitrary JavaScript on it (`/function`).
          Set `browserless_auth_token` to a secret value, and append `?token=<that value>` to the URL that each
          service connecting to Browserless is configured with.
      when: "not browserless_auth_token and not browserless_container_labels_traefik_middleware_basic_auth_enabled | bool"
